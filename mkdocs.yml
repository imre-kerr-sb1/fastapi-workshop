site_name: Build a CRUD API with FastAPI
site_description: >-
  A self-paced workshop. Build a working HTTP API from nothing, and understand
  why it's shaped the way it is.
site_url: https://imre-kerr-sb1.github.io/fastapi-workshop/

repo_url: https://github.com/imre-kerr-sb1/fastapi-workshop
repo_name: imre-kerr-sb1/fastapi-workshop

nav:
  - Start here: index.md
  - Concepts:
      - 1. What even is an API?: 01-what-is-an-api.md
      - 2. Setting up: 02-setup.md
  - Building it:
      - 3. Hello world: 03-hello-world.md
      - 4. Your first model, and a GET: 04-model-and-get.md
      - 5. Who owns the identifier?: 05-identifiers.md
      - 6. Request bodies, and getting them wrong: 06-request-bodies.md
      - 7. Status codes: 07-status-codes.md
  - Wrapping up:
      - 8. What you built, and what's missing: 08-wrap-up.md
      - Solution key: solution-key.md
      - Where to go next: next-steps.md

theme:
  language: en
  features:
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - toc.follow

  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: lucide/sun-moon
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: lucide/moon
        name: Switch to system preference

markdown_extensions:
  abbr: {}
  admonition: {}
  attr_list: {}
  def_list: {}
  footnotes: {}
  md_in_html: {}
  toc:
    permalink: true
  pymdownx.betterem: {}
  pymdownx.caret: {}
  pymdownx.details: {}
  pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
  pymdownx.inlinehilite: {}
  pymdownx.keys: {}
  pymdownx.magiclink: {}
  pymdownx.mark: {}
  pymdownx.smartsymbols: {}
  # Lets solution-key.md include the real files from code/ instead of a stale copy.
  # NOTE: base_path is resolved relative to the working directory, so builds must be
  # run from the repo root. check_paths makes a wrong path fail the build loudly.
  pymdownx.snippets:
    base_path: code
    check_paths: true
  pymdownx.superfences: {}
  pymdownx.tabbed:
    alternate_style: true
    combine_header_slug: true
  pymdownx.tasklist:
    custom_checkbox: true
  pymdownx.tilde: {}
