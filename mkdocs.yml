site_name: Bygg et CRUD-API med FastAPI
site_description: >-
  En selvgående workshop. Bygg et fungerende HTTP-API fra grunnen, og forstå
  hvorfor det er formet slik det er.
site_url: https://fastapi.kerror.net

repo_url: https://github.com/imre-kerr-sb1/fastapi-workshop
repo_name: imre-kerr-sb1/fastapi-workshop

nav:
  - Start her: index.md
  - Episode 1:
      - ep1/index.md
      - Konsepter:
          - 1. Hva er et HTTP-API?: ep1/01-what-is-an-api.md
          - 2. Prosjektoppsett: ep1/02-setup.md
      - Bygging:
          - 3. Hello world: ep1/03-hello-world.md
          - 4. Datamodell og et GET-endepunkt: ep1/04-model-and-get.md
          - 5. Identifikatorer - Hvem bestemmer?: ep1/05-identifiers.md
          - 6. Request bodies: ep1/06-request-bodies.md
          - 7. Statuskoder: ep1/07-status-codes.md
      - Avslutning:
          - 8. Oppsummering, og ideer til neste gang: ep1/08-wrap-up.md
          - Løsningsforslag: ep1/solution-key.md
  - Episode 2:
      - ep2/index.md
      - 1. Middleware: ep2/01-middleware.md
      - 2. Autentisering: ep2/02-auth.md

theme:
  language: nb
  features:
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - toc.follow

  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: lucide/sun-moon
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: lucide/moon
        name: Switch to system preference

markdown_extensions:
  abbr: {}
  admonition: {}
  attr_list: {}
  def_list: {}
  footnotes: {}
  md_in_html: {}
  toc:
    permalink: true
  pymdownx.betterem: {}
  pymdownx.caret: {}
  pymdownx.details: {}
  pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
  pymdownx.inlinehilite: {}
  pymdownx.keys: {}
  pymdownx.magiclink: {}
  pymdownx.mark: {}
  pymdownx.smartsymbols: {}
  # Lets solution-key.md include the real files from code/ instead of a stale copy.
  # NOTE: base_path is resolved relative to the working directory, so builds must be
  # run from the repo root. check_paths makes a wrong path fail the build loudly.
  pymdownx.snippets:
    base_path: code
    check_paths: true
  pymdownx.superfences: {}
  pymdownx.tabbed:
    alternate_style: true
    combine_header_slug: true
  pymdownx.tasklist:
    custom_checkbox: true
  pymdownx.tilde: {}
